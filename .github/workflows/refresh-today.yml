# T10: Scheduled CI news-refresh job.
# design.md §6 (API/Integration Contract) + §13 TD-003 — a scheduled script
# publishing static JSON, not a running backend service. No Edge Functions,
# no Redis, no relay service (TD-004).
#
# The refresh script fetches only the reviewed source allowlist, bounds each
# source, and automatically publishes only recent, valid, confidently
# categorized stories. Malformed, undated, old, or unclassified candidates
# remain excluded, and the existing file is preserved if nothing qualifies.

name: Refresh Today panel content

on:
  schedule:
    # Every 6 hours. The exact interval is an ops decision D-008 leaves
    # open ("not fixed here") — this is a reasonable starting cadence for
    # a bounded, scheduled curated-source feed.
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # manual trigger for testing/ops

permissions:
  contents: write

concurrency:
  group: refresh-today
  cancel-in-progress: false

jobs:
  refresh-today:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install locked dependencies
        run: npm ci

      - name: Test the news pipeline
        run: npm test

      - name: Run news-refresh pipeline
        run: node scripts/refresh-today.js --auto-publish-approved

      - name: Publish Weekly Ledger edition
        run: node scripts/refresh-popular-this-week.js

      - name: Commit publication state if changed
        run: |
          if git diff --quiet -- content/today-stories.json content/popular-this-week.json content/review-queue.json content/category-keywords.json; then
            echo "No publication changes — nothing to commit."
            exit 0
          fi
          git config user.name "flowersbl00minadarkr00m"
          git config user.email "25645848+flowersbl00minadarkr00m@users.noreply.github.com"
          git add content/today-stories.json content/popular-this-week.json content/review-queue.json content/category-keywords.json
          git commit -m "chore: publish Today and Weekly Ledger content"
          git push
