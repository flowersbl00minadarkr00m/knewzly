# T10: Scheduled CI news-refresh job.
# design.md §6 (API/Integration Contract) + §13 TD-003 — a scheduled script
# publishing static JSON, not a running backend service. No Edge Functions,
# no Redis, no relay service (TD-004).
#
# The refresh script fetches only the reviewed allowlist, bounds each source,
# validates the generated JSON, and preserves the existing file if every
# source fails. Only entries already marked reviewed in the versioned queue
# can reach today-stories.json; newly fetched candidates are not committed by
# this workflow.

name: Refresh Today panel content

on:
  schedule:
    # Every 6 hours. The exact interval is an ops decision D-008 leaves
    # open ("not fixed here") — this is a reasonable starting cadence for
    # a bounded, scheduled curated-source feed.
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # manual trigger for testing/ops

permissions:
  contents: write

concurrency:
  group: refresh-today
  cancel-in-progress: false

jobs:
  refresh-today:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Test the news pipeline
        run: npm test

      - name: Run news-refresh pipeline
        run: node scripts/refresh-today.js --publish-reviewed-only

      - name: Commit reviewed publication state if changed
        run: |
          if git diff --quiet -- content/today-stories.json content/review-queue.json content/category-keywords.json; then
            echo "No reviewed publication changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/today-stories.json content/review-queue.json content/category-keywords.json
          git commit -m "chore: publish reviewed Today content [skip ci]"
          git push
