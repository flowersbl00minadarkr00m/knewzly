      - paragraph [ref=f3e22]: Knewzly should help a curious learner explain where an innovation came from, who or what shaped it, and what carried forward across regions and time.
      - generic [ref=f3e23]:
        - strong [ref=f3e24]: The first learning loop
        - text: Orient on time → compare lanes → trace one typed relationship → inspect context and evidence.
      - generic "Four-step learning loop" [ref=f3e25]:
        - generic [ref=f3e26]:
          - text: 01 / ORIENT
          - strong [ref=f3e27]: Find the moment
          - text: Use years and lane labels to build a mental map. ↓
        - generic [ref=f3e28]:
          - text: 02 / COMPARE
          - strong [ref=f3e29]: Notice a bridge
          - text: See parallel developments without a single-center story. ↓
        - generic [ref=f3e30]:
          - text: 03 / TRACE
          - strong [ref=f3e31]: Read the edge
          - text: Understand whether it influenced, enabled, or framed a later step. ↓
        - generic [ref=f3e32]:
          - text: 04 / INSPECT
          - strong [ref=f3e33]: Check the claim
          - text: Open the drawer for narrative, uncertainty, and sources.
