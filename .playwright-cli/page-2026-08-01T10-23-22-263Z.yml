      - heading "Make the history of AI feel connected, not crowded." [level=1] [ref=f5e17]
      - paragraph [ref=f5e18]: "A document-first explanation of the proposed atlas interaction: one shared time axis, parallel regional lanes, a persistent philosophy lane, typed relationships, and a drawer that keeps context visible."
      - paragraph [ref=f5e19]: "Source state: project plan approved. F01 requirements, design, tasks, and implementation are not approved or present. All interactive data in this explainer is simulated."
    - generic [ref=f5e20]:
      - heading "The user outcome" [level=2] [ref=f5e21]
      - paragraph [ref=f5e22]: Knewzly should help a curious learner explain where an innovation came from, who or what shaped it, and what carried forward across regions and time.
      - generic [ref=f5e23]:
        - strong [ref=f5e24]: The first learning loop
        - text: Orient on time → compare lanes → trace one typed relationship → inspect context and evidence.
      - generic "Four-step learning loop" [ref=f5e25]:
        - generic [ref=f5e26]:
          - text: 01 / ORIENT
          - strong [ref=f5e27]: Find the moment
          - text: Use years and lane labels to build a mental map. →
        - generic [ref=f5e28]:
          - text: 02 / COMPARE
          - strong [ref=f5e29]: Notice a bridge
          - text: See parallel developments without a single-center story. →
        - generic [ref=f5e30]:
          - text: 03 / TRACE
          - strong [ref=f5e31]: Read the edge
          - text: Understand whether it influenced, enabled, or framed a later step. →
        - generic [ref=f5e32]:
          - text: 04 / INSPECT
          - strong [ref=f5e33]: Check the claim
          - text: Open the drawer for narrative, uncertainty, and sources.
