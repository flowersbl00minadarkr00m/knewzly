          - paragraph [ref=f1e39]: If every inference costs less, does the grid finally get relief—or does demand simply race ahead?
          - paragraph [ref=f1e40]: By the Knewzly history desk · Analysis
          - generic [ref=f1e41]:
            - paragraph [ref=f1e42]: "Vancouver — Illustrative scenario: AI labs and chipmakers celebrate another fall in the cost of running models. Yet the historical question is not whether each task uses less energy. It is whether cheaper use invites so much more use that total demand rises."
            - paragraph [ref=f1e43]:
              - text: William Stanley Jevons described that tension in
              - emphasis [ref=f1e44]: The Coal Question
              - text: in 1865. More efficient steam engines, he argued, could expand coal consumption by lowering the effective cost of putting engines to work. Modern writers now use “Jevons paradox” as a lens for AI compute.
