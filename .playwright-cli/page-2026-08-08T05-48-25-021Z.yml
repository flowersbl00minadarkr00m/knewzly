    - generic [ref=f1e250]:
      - paragraph [ref=f1e251]:
        - text: In “The Question Concerning Technology,” Martin Heidegger argued that modern technology is not just a set of tools but a mode of “enframing” (
        - emphasis [ref=f1e252]: Ge-stell
        - text: ) that reveals nature only as “standing-reserve” — raw material to be ordered, extracted and used up. Heidegger contrasts this with an older sense of craft as “bringing-forth” (
        - emphasis [ref=f1e253]: poiesis
        - text: ), closer to the kind of skilled, non-extractive technique Zhuangzi’s Cook Ding describes.
      - paragraph [ref=f1e254]: This is a widely cited lens for questioning what gets treated as a resource to extract rather than something to encounter on its own terms — including, in later readers’ hands, the people whose labor trains and moderates AI systems. Heidegger did not write about AI, data labor, or Daoist philosophy; both applications are later readers’ extensions, stated here as such.
