<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Knewzly — Global History Atlas (pilot)</title>
  <style>
    /* Same token vocabulary as atlas.css/today.html (D-014's precedent) —
       the landing page reads as one system with the rest of the app, not a
       third visual language. */
    :root {
      --paper: #f7f3e8;
      --paper-deep: #ece5d2;
      --ink: #1b2433;
      --ink-soft: #3a4658;
      --rule: #6b7684;
      --rule-faint: #b7bfc7;
      --accent: #163a5f;
      --accent-soft: #244f76;
      --shadow: rgba(22, 42, 64, 0.15);
      --display: Georgia, "Times New Roman", Times, serif;
      --utility: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      /* Background motif — derived from --ink-soft/--accent at low opacity,
         named separately so the motif's intensity can be tuned without
         touching the text-color tokens above. */
      --k-line: rgba(58, 70, 88, 0.16);
      --k-dot: rgba(58, 70, 88, 0.32);
      --k-dot-anchor: rgba(22, 58, 95, 0.55);
      --k-axis: rgba(58, 70, 88, 0.4);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161d27;
        --paper-deep: #10151d;
        --ink: #f2ede0;
        --ink-soft: #c9cdd6;
        --rule: #7c8794;
        --rule-faint: #445162;
        --accent: #9ac7e8;
        --accent-soft: #b6d9f1;
        --shadow: rgba(0, 0, 0, 0.34);
        --k-line: rgba(201, 205, 214, 0.14);
        --k-dot: rgba(201, 205, 214, 0.3);
        --k-dot-anchor: rgba(154, 199, 232, 0.75);
        --k-axis: rgba(201, 205, 214, 0.38);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--display);
      position: relative;
      overflow-x: hidden;
    }

    /* --- Background: a constellation of the atlas's own connective
       structure (echoes src/constellation-view.js's force-graph, D-010),
       grounded by a real timeline axis using the atlas's own earliest
       real anchor dates (D-011) — not generic decoration, the shape of
       this app's actual content. Fixed, full-bleed, decorative only. --- */
    .k-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .k-bg svg { width: 100%; height: 100%; display: block; }
    .k-line { stroke: var(--k-line); stroke-width: 1; }
    .k-dot { fill: var(--k-dot); }
    .k-dot-anchor {
      fill: var(--k-dot-anchor);
      transform-origin: center;
      transform-box: fill-box;
      animation: k-pulse 5.5s ease-in-out infinite;
    }
    @keyframes k-pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.45); }
    }
    @media (prefers-reduced-motion: reduce) {
      .k-dot-anchor { animation: none; opacity: 0.85; }
    }

    .k-axis-line { stroke: var(--k-axis); stroke-width: 1.5; }
    .k-tick { stroke: var(--k-axis); stroke-width: 1.5; }
    .k-tick-label {
      fill: var(--ink-soft);
      font-family: var(--utility);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }

    /* --- Foreground content: an opaque "paper" panel over the motif, so
       every rendered text/background pair is the exact same solid
       ink-on-paper contrast as before — the motif never touches text. --- */
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    main {
      max-width: 640px;
      width: 100%;
      padding: clamp(1.75rem, 4vw, 3rem);
      background: var(--paper);
      box-shadow: 0 24px 64px var(--shadow);
      border-top: 5px double var(--ink);
      text-align: center;
    }

    .eyebrow {
      display: block;
      font: 700 0.72rem/1 var(--utility);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.9rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font: 900 clamp(2.6rem, 8vw, 4.2rem)/0.95 var(--display);
      letter-spacing: -0.03em;
    }

    p.dek {
      margin: 0 auto;
      max-width: 34ch;
      color: var(--ink-soft);
      line-height: 1.55;
      font-size: 1.05rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      margin-top: 1.75rem;
      flex-wrap: wrap;
      text-align: left;
    }
    a.card {
      flex: 1;
      min-width: 220px;
      padding: 1rem 1.2rem;
      border: 1px solid var(--rule-faint);
      color: var(--ink);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover, a.card:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }
    a.card:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
    a.card strong {
      display: block;
      font: 700 0.7rem/1 var(--utility);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }
    a.card span { display: block; font-size: 0.92rem; line-height: 1.4; }
  </style>
</head>
