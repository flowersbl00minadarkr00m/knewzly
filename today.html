<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Knewzly — Today</title>
  <style>
    :root {
      --paper: #f6f1e3;
      --paper-deep: #e9e1cc;
      --ink: #172235;
      --ink-soft: #43505f;
      --rule: #687586;
      --rule-faint: #b5b9b5;
      --spot: #163a5f;
      --spot-soft: #244f76;
      --inverse: #fbf7ea;
      --focus: #00685d;
      --shadow: rgba(22, 42, 64, 0.15);
      --ok: #1d5a33;
      --warn: #6c4900;
      --bad: #7a1f1f;
      --display: Georgia, "Times New Roman", Times, serif;
      --body: Georgia, "Times New Roman", Times, serif;
      --utility: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --paper: #18212b;
      --paper-deep: #10171f;
      --ink: #f3eddf;
      --ink-soft: #c5c4be;
      --rule: #909dab;
      --rule-faint: #4f5e6e;
      --spot: #9ac7e8;
      --spot-soft: #b6d9f1;
      --inverse: #111923;
      --focus: #f1c96b;
      --shadow: rgba(0, 0, 0, 0.34);
      --ok: #7fcf9a;
      --warn: #e8c25b;
      --bad: #eb9898;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper-deep);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.45;
    }

    button, a { font: inherit; }
    a { color: inherit; }
    a:hover { color: var(--spot); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .concept-banner {
      padding: 0.55rem 1rem;
      color: var(--inverse);
      background: var(--spot);
      font: 700 0.75rem/1.2 var(--utility);
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .paper {
      width: min(1200px, calc(100% - 2rem));
      margin: 1.25rem auto 3rem;
      padding: clamp(1rem, 2.6vw, 2.5rem);
      background: var(--paper);
      box-shadow: 0 18px 48px var(--shadow);
    }

    /* Masthead — reuses the F07 newspaper-concept's visual language
       (.ai/sdd/design/present-day-newspaper-concept.html), adapted here to
       today.html's already-AAA-verified color tokens (D-014). */
    .masthead {
      padding: 1.15rem 0 0.8rem;
      border-bottom: 5px double var(--ink);
      text-align: center;
    }

    .masthead h1 {
      margin: 0;
      font: 900 clamp(2.4rem, 6vw, 4.6rem)/0.9 var(--display);
      letter-spacing: -0.04em;
    }

    .masthead-mark {
      display: block;
      margin-top: 0.4rem;
      font: 700 clamp(0.6rem, 1vw, 0.75rem)/1 var(--utility);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .edition-line {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--ink);
      color: var(--ink-soft);
      font: 700 0.67rem/1.2 var(--utility);
      letter-spacing: 0.075em;
      text-transform: uppercase;
    }

    /* Section nav — real filter chips (FR-014/D-013), same button +
       aria-pressed pattern as the F07 mockup's .section-nav. */
    .section-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 0.48rem 0;
      border-bottom: 1px solid var(--rule);
    }

    .section-nav button {
      flex: 0 0 auto;
      border: 0;
      border-right: 1px solid var(--rule-faint);
      padding: 0.3rem 0.9rem;
      color: var(--ink-soft);
      background: transparent;
      cursor: pointer;
      font: 700 0.72rem/1.2 var(--utility);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .section-nav button:first-child { padding-left: 0; }
    .section-nav button:last-child { border-right: 0; }
    .section-nav button:hover { color: var(--spot); }
    .section-nav button[aria-pressed="true"] {
      color: var(--spot);
      text-decoration: underline;
      text-underline-offset: 0.25rem;
      font-weight: 800;
    }

    /* FreshnessBanner — must read distinctly and truthfully per state
       (FR-015/NFR-004). Never color-only: label text differs per state. */
    .freshness-banner {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      align-items: baseline;
      margin: 1rem 0;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--rule);
      border-left-width: 6px;
      font: 0.85rem/1.4 var(--utility);
    }

    .freshness-label {
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .freshness-fresh { border-left-color: var(--ok); }
    .freshness-fresh .freshness-label { color: var(--ok); }

    .freshness-stale { border-left-color: var(--warn); }
    .freshness-stale .freshness-label { color: var(--warn); }

    .freshness-very_stale { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
    .freshness-very_stale .freshness-label { color: var(--warn); }

    .freshness-no_data,
    .freshness-error,
    .freshness-fetch-error {
      border-left-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 10%, transparent);
    }
    .freshness-no_data .freshness-label,
    .freshness-error .freshness-label,
    .freshness-fetch-error .freshness-label { color: var(--bad); }

    .freshness-floor-notice { color: var(--ink-soft); font-style: italic; }
    .freshness-updated { color: var(--ink-soft); margin-left: auto; }

    /* Story grid — newspaper column layout. Every card is a real, styled
       "column story" (headline hierarchy, byline/dateline, jump-style
       trace line) rather than a uniform card grid. */
    #story-grid,
    #story-grid-after-ledger {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      margin-top: 1.4rem;
      border-top: 5px double var(--ink);
      border-bottom: 5px double var(--ink);
    }

    .story-card {
      min-height: 100%;
      padding: 1rem;
      border-right: 1px solid var(--rule);
      border-top: 0;
    }

    .story-card:nth-child(3n) { border-right: 0; }

    #weekly-ledger {
      margin: 1.4rem 0;
      border-top: 5px double var(--ink);
      border-bottom: 5px double var(--ink);
    }

    .weekly-ledger { padding: 1rem 0; min-width: 0; }
    .weekly-ledger-metadata { padding: 0 1rem; }
    .weekly-ledger-kicker,
    .weekly-ledger-rank,
    .weekly-ledger-category,
    .weekly-ledger-providers,
    .weekly-ledger-refresh-context,
    .weekly-ledger-filter-status {
      font: 700 0.7rem/1.35 var(--utility);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .weekly-ledger-kicker,
    .weekly-ledger-category { color: var(--spot); }
    .weekly-ledger-heading { margin: 0.2rem 0 0.5rem; font: 800 clamp(1.8rem, 4vw, 2.7rem)/1 var(--display); }
    .weekly-ledger-methodology { margin: 0.8rem 0; max-width: 76ch; }
    .weekly-ledger-methodology summary { cursor: pointer; font-weight: 700; }
    .weekly-ledger-methodology p,
    .weekly-ledger-degraded,
    .weekly-ledger-aging,
    .weekly-ledger-unavailable,
    .weekly-ledger-empty { max-width: 76ch; overflow-wrap: anywhere; }
    .weekly-ledger-providers,
    .weekly-ledger-refresh-context,
    .weekly-ledger-filter-status { margin: 0.55rem 0; color: var(--ink-soft); }
    .weekly-ledger-degraded,
    .weekly-ledger-aging { color: var(--warn); font-weight: 700; }
    .weekly-ledger-list { margin: 1rem 0 0; padding: 0; list-style-position: inside; }
    .weekly-ledger-item { margin: 0; border-top: 1px solid var(--rule); }
    .weekly-ledger-entry { display: grid; grid-template-columns: minmax(4rem, 0.35fr) minmax(0, 2.6fr) minmax(0, 1fr); gap: 0.5rem 1rem; padding: 1rem; min-width: 0; }
    .weekly-ledger-rank,
    .weekly-ledger-category { margin: 0; }
    .weekly-ledger-headline { grid-column: 2; margin: 0; font: 800 1.35rem/1.1 var(--display); overflow-wrap: anywhere; }
    .weekly-ledger-source,
    .weekly-ledger-evidence,
    .weekly-ledger-trace { grid-column: 2 / -1; margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .weekly-ledger-evidence { padding-left: 1.25rem; font: 0.82rem/1.45 var(--utility); }
    .weekly-ledger-source,
    .weekly-ledger-trace { font: 700 0.72rem/1.35 var(--utility); letter-spacing: 0.04em; text-transform: uppercase; }
    .weekly-ledger-trace { color: var(--spot-soft); }

    .story-card-category {
      margin: 0 0 0.35rem;
      color: var(--spot);
      font: 800 0.66rem/1.2 var(--utility);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .story-card-headline {
      margin: 0 0 0.4rem;
      font: 800 1.55rem/1.06 var(--display);
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .story-card-dek {
      margin: 0.3rem 0;
      color: var(--ink-soft);
      font: italic 0.95rem/1.4 var(--display);
    }

    .story-card-meta { margin-top: 0.5rem; font-family: var(--utility); }
    .story-card-source,
    .story-card-trace {
      margin: 0.3rem 0;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .story-card-source a { text-underline-offset: 0.16rem; }
    .story-card-trace { color: var(--spot-soft); }
    /* T9: the trace text becomes a real link into atlas.html?anchor=...;
       reuses the same already-verified color as the surrounding text. */
    .story-card-trace-link { color: inherit; text-underline-offset: 0.16rem; }

    .story-grid-empty,
    .story-grid-error {
      grid-column: 1 / -1;
      padding: 2rem;
      border: 1px solid var(--rule);
      text-align: center;
      font-style: italic;
    }

    .story-grid-error { border-color: var(--bad); color: var(--bad); font-style: normal; font-weight: 700; }

    .folio {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--rule);
      color: var(--ink-soft);
      font-size: 0.62rem;
      font-weight: 700;
      font-family: var(--utility);
    }

    @media (max-width: 980px) {
      #story-grid,
      #story-grid-after-ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .story-card:nth-child(3n) { border-right: 1px solid var(--rule); }
      .story-card:nth-child(2n) { border-right: 0; }
    }

    @media (max-width: 680px) {
      body { font-size: 15px; }
      .paper { width: 100%; margin: 0; padding: 0.85rem; box-shadow: none; }
      .masthead h1 { font-size: clamp(2.8rem, 17vw, 5rem); }
      .edition-line { flex-direction: column; gap: 0.2rem; }
      #story-grid,
      #story-grid-after-ledger { grid-template-columns: minmax(0, 1fr); }
      #story-grid > .story-card,
      #story-grid-after-ledger > .story-card {
        grid-column: auto;
        min-width: 0;
      }
      .story-card,
      .story-card:nth-child(2n),
      .story-card:nth-child(3n) { border-right: 0; border-top: 1px solid var(--rule); padding: 1rem 0; }
      .story-card:first-child { border-top: 0; }
      .weekly-ledger-metadata { padding: 0; }
      .weekly-ledger-entry { grid-template-columns: minmax(3.5rem, 0.3fr) minmax(0, 1fr); padding: 1rem 0; }
      .weekly-ledger-category { grid-column: 2; }
      .weekly-ledger-headline,
      .weekly-ledger-source,
      .weekly-ledger-evidence,
      .weekly-ledger-trace { grid-column: 1 / -1; }
      .folio { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="concept-banner">Knewzly — Today panel (F01 pilot slice)</div>

  <main class="paper" id="top">
    <header class="masthead">
      <h1>Today</h1>
      <span class="masthead-mark">Current AI news, traced to where it came from</span>
    </header>

    <div class="edition-line">
      <span>History before hype</span>
      <span>Every story traces to a real historical anchor</span>
    </div>

    <nav class="section-nav" id="section-nav" aria-label="Filter stories by category"></nav>

    <div id="freshness-banner" aria-live="polite"></div>

    <section id="story-grid" aria-label="Today's stories before the Weekly Ledger"></section>
    <div id="weekly-ledger"></div>
    <section id="story-grid-after-ledger" aria-label="Today's stories after the Weekly Ledger"></section>

    <footer class="folio">
      <span>Knewzly — Global History Atlas (F01 pilot)</span>
      <a href="atlas.html">Go to the Atlas →</a>
    </footer>
  </main>

  <script type="module">
    import { loadContent, loadWeeklyLedger, fetchReader } from './src/content-loader.js';
    import { renderFreshnessBanner, renderFreshnessBannerError } from './src/freshness-banner.js';
    import { renderStoryGrid, renderStoryGridError } from './src/story-grid.js';
    import { wireTraceToOrigin } from './src/trace-to-origin.js';
    import { getAvailableCategories, filterStoriesByCategory, ALL_CATEGORIES_ID } from './src/story-filters.js';
    import { renderSectionNav } from './src/section-nav.js';
    import { effectiveLedgerState, filterWeeklyLedger, joinWeeklyLedger, renderWeeklyLedger } from './src/weekly-ledger.js';

    // Real content/today-stories.json now exists (seeded pre-launch by T12,
    // freshnessState: no_data until T10's CI job actually runs). Defaults to
    // real content, matching atlas.html's ContentLoader default. basePath
    // stays overridable via ?basePath=content/fixtures/ for manual QA
    // against fixture copies (e.g. to exercise each freshnessState) without
    // editing the real file in place.
    const params = new URLSearchParams(location.search);
    const basePath = params.get('basePath') || 'content/';

    const navEl = document.querySelector('#section-nav');
    const bannerEl = document.querySelector('#freshness-banner');
    const gridEl = document.querySelector('#story-grid');
    const ledgerEl = document.querySelector('#weekly-ledger');
    const trailingGridEl = document.querySelector('#story-grid-after-ledger');

    let allStories = [];
    let activeCategory = ALL_CATEGORIES_ID;
    let weeklyDocument = null;

    function renderRegularGrid(container, stories) {
      container.hidden = stories.length === 0;
      if (container.hidden) {
        container.replaceChildren();
        return;
      }
      renderStoryGrid(container, stories);
      wireTraceToOrigin(container, stories);
    }

    function weeklyStoryIdsForCurrentEdition(category) {
      if (!weeklyDocument || effectiveLedgerState(weeklyDocument).status === 'unavailable') return new Set();
      const { resolved } = joinWeeklyLedger(weeklyDocument, { stories: allStories });
      const visibleLedgerEntries = filterWeeklyLedger(resolved, category);
      return new Set(visibleLedgerEntries.flatMap(({ entry }) => [entry.leadStoryId, ...(entry.memberStoryIds || [])]));
    }

    // FR-014/D-013: filtering is a client-side re-render over the same
    // already-loaded stories — no re-fetch, no server round-trip.
    function renderFiltered(restoreActiveFilterFocus = false) {
      const categories = getAvailableCategories(allStories);
      renderSectionNav(navEl, categories, activeCategory, (id, triggeredFromFocusedChip) => {
        activeCategory = id;
        renderFiltered(triggeredFromFocusedChip);
      }, restoreActiveFilterFocus);
      const filtered = filterStoriesByCategory(allStories, activeCategory);
      const weeklyStoryIds = weeklyStoryIdsForCurrentEdition(activeCategory);
      const regularStories = filtered.filter((story) => !weeklyStoryIds.has(story.id));
      renderRegularGrid(gridEl, regularStories.slice(0, 3));
      renderWeeklyLedger(ledgerEl, weeklyDocument, { stories: allStories }, { category: activeCategory });
      renderRegularGrid(trailingGridEl, regularStories.slice(3));
    }

    async function init() {
      let content;
      try {
        content = await loadContent({ basePath, reader: fetchReader });
      } catch (err) {
        console.error('Today panel: failed to load content', err);
        renderFreshnessBannerError(
          bannerEl,
          `Could not load today's news feed (${err.message}). Nothing shown here should be treated as current.`,
        );
        renderStoryGridError(gridEl, "Today's stories could not be loaded. Please try again later.");
        return;
      }

      const { todayStories } = content;
      renderFreshnessBanner(bannerEl, todayStories);
      allStories = todayStories.stories;
      renderFiltered();
      weeklyDocument = await loadWeeklyLedger({ basePath, reader: fetchReader });
      renderFiltered();
    }

    init();
  </script>
</body>
</html>
